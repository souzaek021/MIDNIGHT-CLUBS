<main><section class="admin-section"><div class="admin-container"><div class="admin-heading"><span class="eyebrow">SISTEMA / CLIENTES</span><h1>Base de <strong>clientes.</strong></h1><p>Clientes cadastrados durante as compras de ingressos.</p></div><div class="table-card"><div class="table-top"><h2>Clientes cadastrados</h2><span id="clientCount">0</span></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th></tr></thead><tbody id="clientTable"></tbody></table></div></div></div></section></main><script src="../Js/main.js"></script><script>const data=JSON.parse(localStorage.getItem('midnightClientes')||'[]');document.getElementById('clientCount').textContent=data.length+' cliente(s)';const body=document.getElementById('clientTable');body.innerHTML=data.length?data.map(c=>`<tr><td>${c.idCliente||'-'}</td><td>${c.nome||'-'}</td><td>${c.cpf||'-'}</td><td>${c.telefone||'-'}</td><td>${c.email||'-'}</td></tr>`).join(''):`<tr><td colspan="5" class="table-empty">Nenhum cliente cadastrado.</td></tr>`;</script></body></html>
