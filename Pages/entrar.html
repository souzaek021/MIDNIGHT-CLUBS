<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Entrar | Midnight Clubs</title>
    <link rel="stylesheet" href="../Css/global.css">
    <link rel="stylesheet" href="../Css/admin.css">
</head>
<body>
<header class="header">
    <div class="header-container">
        <a href="../index.html" class="logo">MIDNIGHT<span>CLUBS</span></a>
        <nav class="main-nav">
            <a href="../index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="ingressos.html">Ingressos</a>
        </nav>
        <div class="header-actions">
            <a href="criar-conta.html" class="login-link not-admin">Criar Conta</a>
            <a href="entrar.html" class="login-link not-admin active">Entrar</a>
            <a href="admin-login.html" class="button not-admin" style="padding: 8px 20px; margin-top: 0; margin-left: 15px; background: transparent; border: 1px solid var(--accent); color: var(--text);">Admin</a>
            
            <div class="system-container is-admin" style="display: none;">
                <button class="admin-tab" id="dotsButton" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">Menu Admin</button>
                <div class="system-menu" id="systemMenu">
                    <div class="system-title">ADMINISTRADOR</div>
                    <a href="gestao.html">Painel de Controle</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="vendas.html">Vendas</a>
                    <a href="#" id="logoutAdmin" style="color: #ff4d4d;">Sair (Logout)</a>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="auth-card">
            <span class="eyebrow">ACESSO</span>
            <h1>Entrar no <strong>sistema.</strong></h1>
            <p>Acesse sua área para acompanhar seus ingressos.</p>
            <form id="loginForm">
                <label for="email">E-mail</label>
                <input id="email" type="email" required placeholder="seuemail@email.com">
                <label for="senha">Senha</label>
                <input id="senha" type="password" required placeholder="Digite sua senha">
                <button class="button" type="submit">Entrar</button>
                <div id="loginMessage" class="form-message"></div>
            </form>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-container">
        <div>
            <div class="logo">MIDNIGHT<span>CLUBS</span></div>
            <p>Experiências que marcam.</p>
        </div>
    </div>
</footer>

<script src="../Js/main.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    localStorage.setItem('midnightUsuario',JSON.stringify({email:document.getElementById('email').value}));
    document.getElementById('loginMessage').textContent='Login realizado com sucesso.';
    document.getElementById('loginMessage').className='form-message success';
});

document.addEventListener("DOMContentLoaded", function() {
    const isAdmin = localStorage.getItem('midnightAdmin') === 'true';
    if (isAdmin) {
        document.querySelectorAll('.not-admin').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.is-admin').forEach(el => el.style.display = 'block');
    }
    const logoutBtn = document.getElementById('logoutAdmin');
    if(logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('midnightAdmin');
            window.location.reload();
        });
    }
});
</script>
</body>
</html>
