<!DOCTYPE html>

<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar | Midnight Clubs</title><link rel="stylesheet" href="../Css/global.css"><link rel="stylesheet" href="../Css/admin.css"></head>

<header class="header"><div class="header-container"><a href="../html/index.html" class="logo">MIDNIGHT<span>CLUBS</span></a><nav class="main-nav"><a href="../html/index.html">Início</a><a href="eventos.html">Eventos</a><a href="ingressos.html">Ingressos</a></nav><div class="header-actions"><a href="entrar.html" class="login-link active">Entrar</a><div class="system-container"><button class="dots-button" id="dotsButton"><span></span><span></span><span></span></button><div class="system-menu" id="systemMenu"><div class="system-title">SISTEMA</div><a href="gestao.html">Painel de Gestão</a><a href="clientes.html">Clientes</a><a href="vendas.html">Vendas</a></div></div></div></div></header>
<main><section class="auth-section"><div class="auth-card"><span class="eyebrow">ACESSO</span><h1>Entrar no <strong>sistema.</strong></h1><p>Acesse sua área para acompanhar ingressos e informações do sistema.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" required placeholder="seuemail@email.com"><label for="senha">Senha</label><input id="senha" type="password" required placeholder="Digite sua senha"><button class="button" type="submit">Entrar</button><div id="loginMessage" class="form-message"></div></form></div></section></main>

<script src="../Js/main.js"></script><script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();localStorage.setItem('midnightUsuario',JSON.stringify({email:document.getElementById('email').value}));document.getElementById('loginMessage').textContent='Login realizado com sucesso.';document.getElementById('loginMessage').className='form-message success';});</script>
</body></html>
