<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Criar Conta | Midnight Clubs</title>
    <link rel="stylesheet" href="../Css/global.css">
    <link rel="stylesheet" href="../Css/admin.css">
</head>
<body>
<header class="header">
    <div class="header-container">
        <a href="../index.html" class="logo">MIDNIGHT<span>CLUBS</span></a>
        <nav class="main-nav">
            <a href="../index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="ingressos.html">Ingressos</a>
        </nav>
        <div class="header-actions">
            <a href="criar-conta.html" class="login-link not-admin active">Criar Conta</a>
            <a href="entrar.html" class="login-link not-admin">Entrar</a>
            <a href="admin-login.html" class="button not-admin" style="padding: 8px 20px; margin-top: 0; margin-left: 15px; background: transparent; border: 1px solid var(--accent); color: var(--text);">Admin</a>
            
            <div class="system-container is-admin" style="display: none;">
                <button class="admin-tab" id="dotsButton" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">Menu Admin</button>
                <div class="system-menu" id="systemMenu">
                    <div class="system-title">ADMINISTRADOR</div>
                    <a href="gestao.html">Painel de Controle</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="vendas.html">Vendas</a>
                    <a href="#" id="logoutAdmin" style="color: #ff4d4d;">Sair (Logout)</a>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="auth-card" style="max-width: 600px;">
            <span class="eyebrow">CADASTRO</span>
            <h1>Criar sua <strong>conta.</strong></h1>
            <p>Cadastre-se para comprar ingressos e acessar seus eventos.</p>
            <form id="registerForm">
                <label for="nome">Nome Completo</label>
                <input id="nome" type="text" required placeholder="Digite seu nome completo">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input id="dataNascimento" type="date" required style="width: 100%;">
                    </div>
                    <div>
                        <label for="cpf">CPF</label>
                        <input id="cpf" type="text" required placeholder="000.000.000-00" style="width: 100%;">
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label for="cep">CEP</label>
                        <input id="cep" type="text" required placeholder="00000-000" style="width: 100%;">
                    </div>
                    <div>
                        <label for="numero">Número</label>
                        <input id="numero" type="text" required placeholder="Nº da residência" style="width: 100%;">
                    </div>
                </div>
                
                <label for="email">E-mail</label>
                <input id="email" type="email" required placeholder="seuemail@email.com">
                
                <label for="senha">Senha</label>
                <input id="senha" type="password" required placeholder="Crie uma senha">
                
                <button class="button" type="submit">Criar Conta</button>
                <div id="registerMessage" class="form-message"></div>
            </form>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-container">
        <div>
            <div class="logo">MIDNIGHT<span>CLUBS</span></div>
            <p>Experiências que marcam.</p>
        </div>
    </div>
</footer>

<script src="../Js/main.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    const dataNascimento = new Date(document.getElementById('dataNascimento').value);
    const hoje = new Date();
    let idade = hoje.getFullYear() - dataNascimento.getFullYear();
    const m = hoje.getMonth() - dataNascimento.getMonth();
    
    if (m < 0 || (m === 0 && hoje.getDate() < dataNascimento.getDate())) {
        idade--;
    }
    
    const messageEl = document.getElementById('registerMessage');
    
    if (idade < 18) {
        messageEl.textContent = 'Você precisa ter mais de 18 anos para criar uma conta.';
        messageEl.className = 'form-message error';
        messageEl.style.color = '#ff4d4d';
    } else {
        localStorage.setItem('midnightUsuario', JSON.stringify({email: document.getElementById('email').value}));
        messageEl.textContent = 'Conta criada com sucesso! Faça login para continuar.';
        messageEl.className = 'form-message success';
        messageEl.style.color = '#4caf50';
    }
});

document.addEventListener("DOMContentLoaded", function() {
    const isAdmin = localStorage.getItem('midnightAdmin') === 'true';
    if (isAdmin) {
        document.querySelectorAll('.not-admin').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.is-admin').forEach(el => el.style.display = 'block');
    }
    const logoutBtn = document.getElementById('logoutAdmin');
    if(logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('midnightAdmin');
            window.location.reload();
        });
    }
});
</script>
</body>
</html>
