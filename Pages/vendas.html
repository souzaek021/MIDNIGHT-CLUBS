<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Vendas | Midnight Clubs</title>
    <link rel="stylesheet" href="../Css/global.css">
    <link rel="stylesheet" href="../Css/admin.css">
</head>
<body>
<header class="header">
    <div class="header-container">
        <a href="../index.html" class="logo">MIDNIGHT<span>CLUBS</span></a>
        <nav class="main-nav">
            <a href="../index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="ingressos.html">Ingressos</a>
        </nav>
        <div class="header-actions">
            <a href="criar-conta.html" class="login-link not-admin">Criar Conta</a>
            <a href="entrar.html" class="login-link not-admin">Entrar</a>
            <a href="admin-login.html" class="button not-admin" style="padding: 8px 20px; margin-top: 0; margin-left: 15px; background: transparent; border: 1px solid var(--accent); color: var(--text);">Admin</a>
            
            <div class="system-container is-admin" style="display: none;">
                <button class="admin-tab" id="dotsButton" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">Menu Admin</button>
                <div class="system-menu" id="systemMenu">
                    <div class="system-title">ADMINISTRADOR</div>
                    <a href="gestao.html">Painel de Controle</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="vendas.html">Vendas</a>
                    <a href="#" id="logoutAdmin" style="color: #ff4d4d;">Sair (Logout)</a>
                </div>
            </div>
        </div>
    </div>
</header>
<main>
    <section class="admin-section">
        <div class="admin-container">
            <div class="admin-heading">
                <span class="eyebrow">SISTEMA / VENDAS</span>
                <h1>Controle de <strong>vendas.</strong></h1>
                <p>Acompanhe as vendas e os ingressos registrados.</p>
            </div>
            <div class="sales-summary">
                <div class="stat-card"><span>VENDAS</span><strong id="saleCount">0</strong></div>
                <div class="stat-card"><span>RECEITA</span><strong id="revenue">R$ 0,00</strong></div>
            </div>
            <div class="table-card">
                <div class="table-top"><h2>Vendas realizadas</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>ID</th><th>Cliente</th><th>Evento</th><th>Quantidade</th><th>Total</th><th>Data</th></tr></thead>
                        <tbody id="salesTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
<script src="../Js/main.js"></script>
<script>
const sales=JSON.parse(localStorage.getItem('midnightVendas')||'[]');
document.getElementById('saleCount').textContent=sales.length;
const total=sales.reduce((s,v)=>s+Number(v.valorTotal||0),0);
document.getElementById('revenue').textContent=total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const body=document.getElementById('salesTable');
body.innerHTML=sales.length?sales.map(v=>`<tr><td>${v.idVenda||'-'}</td><td>${v.idCliente||'-'}</td><td>${v.nomeEvento||v.idProduto||'-'}</td><td>${v.quantidade||0}</td><td>${Number(v.valorTotal||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td><td>${v.dataVenda||'-'}</td></tr>`).join(''):`<tr><td colspan="6" class="table-empty">Nenhuma venda registrada.</td></tr>`;

document.addEventListener("DOMContentLoaded", function() {
    const isAdmin = localStorage.getItem('midnightAdmin') === 'true';
    if (!isAdmin) window.location.href = 'admin-login.html'; // Protege a página de vendas
    
    document.querySelectorAll('.not-admin').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.is-admin').forEach(el => el.style.display = 'block');
    
    const logoutBtn = document.getElementById('logoutAdmin');
    if(logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('midnightAdmin');
            window.location.href = '../index.html';
        });
    }
});
</script>
</body>
</html>
