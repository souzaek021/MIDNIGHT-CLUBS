<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vendas | Midnight Clubs</title><link rel="stylesheet" href="../Css/global.css"><link rel="stylesheet" href="../Css/admin.css"></head><body>
<header class="header"><div class="header-container"><a href="../index.html" class="logo">MIDNIGHT<span>CLUBS</span></a><nav class="main-nav"><a href="../index.html">Início</a><a href="eventos.html">Eventos</a><a href="ingressos.html">Ingressos</a></nav><div class="header-actions"><a href="entrar.html" class="login-link">Entrar</a><div class="system-container"><button class="dots-button" id="dotsButton"><span></span><span></span><span></span></button><div class="system-menu" id="systemMenu"><div class="system-title">SISTEMA</div><a href="gestao.html">Painel de Gestão</a><a href="clientes.html">Clientes</a><a href="vendas.html">Vendas</a></div></div></div></div></header>
<main><section class="admin-section"><div class="admin-container"><div class="admin-heading"><span class="eyebrow">SISTEMA / VENDAS</span><h1>Controle de <strong>vendas.</strong></h1><p>Acompanhe as vendas e os ingressos registrados.</p></div><div class="sales-summary"><div class="stat-card"><span>VENDAS</span><strong id="saleCount">0</strong></div><div class="stat-card"><span>RECEITA</span><strong id="revenue">R$ 0,00</strong></div></div><div class="table-card"><div class="table-top"><h2>Vendas realizadas</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Cliente</th><th>Evento</th><th>Quantidade</th><th>Total</th><th>Data</th></tr></thead><tbody id="salesTable"></tbody></table></div></div></div></section></main><script src="../Js/main.js"></script><script>const sales=JSON.parse(localStorage.getItem('midnightVendas')||'[]');document.getElementById('saleCount').textContent=sales.length;const total=sales.reduce((s,v)=>s+Number(v.valorTotal||0),0);document.getElementById('revenue').textContent=total.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const body=document.getElementById('salesTable');body.innerHTML=sales.length?sales.map(v=>`<tr><td>${v.idVenda||'-'}</td><td>${v.idCliente||'-'}</td><td>${v.nomeEvento||v.idProduto||'-'}</td><td>${v.quantidade||0}</td><td>${Number(v.valorTotal||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td><td>${v.dataVenda||'-'}</td></tr>`).join(''):`<tr><td colspan="6" class="table-empty">Nenhuma venda registrada.</td></tr>`;</script></body></html>
