<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login Administrativo | Midnight Clubs</title>
    <link rel="stylesheet" href="../Css/global.css">
    <link rel="stylesheet" href="../Css/admin.css">
</head>
<body>
<header class="header">
    <div class="header-container">
        <a href="../index.html" class="logo">MIDNIGHT<span>CLUBS</span></a>
        <nav class="main-nav">
            <a href="../index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="ingressos.html">Ingressos</a>
        </nav>
        <div class="header-actions">
            <a href="criar-conta.html" class="login-link not-admin">Criar Conta</a>
            <a href="entrar.html" class="login-link not-admin">Entrar</a>
            <a href="admin-login.html" class="button not-admin" style="padding: 8px 20px; margin-top: 0; margin-left: 15px; border: 1px solid var(--accent);">Admin</a>
            
            <div class="system-container is-admin" style="display: none;">
                <button class="admin-tab" id="dotsButton" style="background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px;">Menu Admin</button>
                <div class="system-menu" id="systemMenu">
                    <div class="system-title">ADMINISTRADOR</div>
                    <a href="gestao.html">Painel de Controle</a>
                    <a href="clientes.html">Clientes</a>
                    <a href="vendas.html">Vendas</a>
                    <a href="#" id="logoutAdmin" style="color: #ff4d4d;">Sair (Logout)</a>
                </div>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="auth-card">
            <span class="eyebrow" style="color: #ff4d4d;">ACESSO RESTRITO</span>
            <h1>Portal do <strong>Admin.</strong></h1>
            <p>Faça login para gerenciar eventos, clientes e vendas.</p>
            <form id="adminLoginForm">
                <label for="adminUser">Usuário / E-mail</label>
                <input id="adminUser" type="text" required placeholder="admin@midnightclubs.com">
                <label for="adminPass">Senha</label>
                <input id="adminPass" type="password" required placeholder="Digite a senha de administrador">
                <button class="button" type="submit" style="background: #ff4d4d;">Acessar Painel</button>
                <div id="adminMessage" class="form-message"></div>
            </form>
        </div>
    </section>
</main>

<script src="../Js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const isAdmin = localStorage.getItem('midnightAdmin') === 'true';
    if (isAdmin) {
        document.querySelectorAll('.not-admin').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.is-admin').forEach(el => el.style.display = 'block');
    }
    const logoutBtn = document.getElementById('logoutAdmin');
    if(logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('midnightAdmin');
            window.location.reload();
        });
    }
});

document.getElementById('adminLoginForm').addEventListener('submit', function(e){
    e.preventDefault();
    localStorage.setItem('midnightAdmin', 'true');
    const msg = document.getElementById('adminMessage');
    msg.textContent = 'Acesso liberado. Redirecionando...';
    msg.className = 'form-message success';
    setTimeout(() => { window.location.href = 'gestao.html'; }, 1000);
});
</script>
</body>
</html>
